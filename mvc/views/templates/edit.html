{% extends 'base.html' %}

{% block title %}Modifier un Contact{% endblock %}

{% block header %}Modifier un Contact{% endblock %}

{% block content %}
    <section class="card">
        <div class="card-header">
            <h2 class="card-title">Modifier le contact</h2>
        </div>

        <form method="POST" action="{{ url_for('contact.edit_contact', id=contact['id']) }}" data-validate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="nom">Nom*:</label>
                <input type="text" id="nom" name="nom" value="{{ contact['nom'] or '' }}" required>
            </div>

            <div class="form-group">
                <label for="prenom">Prénom*:</label>
                <input type="text" id="prenom" name="prenom" value="{{ contact['prenom'] or '' }}" required>
            </div>

            <div class="form-group">
                <label for="telephone">Téléphone:</label>
                <input type="tel" id="telephone" name="telephone" value="{{ contact['telephone'] or '' }}" placeholder="10 chiffres">
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" value="{{ contact['email'] or '' }}" placeholder="exemple@domaine.com">
            </div>

            <div class="form-group">
                <label for="adresse">Adresse:</label>
                <input type="text" id="adresse" name="adresse" value="{{ contact['adresse'] or '' }}">
            </div>

            <div class="actions">
                <input type="submit" value="Enregistrer">
                <a class="btn btn-secondary" href="{{ url_for('contact.index') }}">Annuler</a>
            </div>
        </form>
    </section>
{% endblock %}
